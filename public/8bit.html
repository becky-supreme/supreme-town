<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supreme Town 8-bit mock-up</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a18; color: #fff; font: 700 13px/1.3 "Courier New", ui-monospace, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #tags { pointer-events: none; }
  .box { position: fixed; background: #0b0a18; border: 4px solid #fff; box-shadow: 6px 6px 0 #ff3df2; padding: 10px 14px; text-transform: uppercase; letter-spacing: .06em; z-index: 5; }
  #title { top: 16px; left: 16px; max-width: min(430px, calc(100vw - 32px)); }
  #title b { display: block; font-size: 20px; color: #ffd24a; }
  #title span { color: #b9b4dc; text-transform: none; letter-spacing: 0; font-weight: 400; }
  #bar { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); box-shadow: 6px 6px 0 #27e0ff; }
  button { font: inherit; text-transform: uppercase; letter-spacing: .06em; color: #fff; background: #2a2140; border: 3px solid #fff; padding: 7px 10px; cursor: pointer; }
  button:hover { background: #46376b; }
  button.on { background: #ffd24a; color: #0b0a18; }
  .sep { width: 3px; background: #fff; margin: 0 4px; }
  a { color: #27e0ff; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="tags"></canvas>
<div class="box" id="title">
  <b>8-bit mock-up</b>
  <span>One part of Supreme Town as a classic top-down pixel game: crisp big pixels, dark outlines, flat bright colour. Flip between the two looks to compare. <a href="/">Back to town</a></span>
</div>
<div class="box" id="bar">
  <button data-look="8bit" class="on">8-bit</button>
  <button data-look="modern">Current look</button>
  <span class="sep"></span>
  <button data-area="bar" class="on">The Afterworks</button>
  <button data-area="lounge">Lounge</button>
  <button data-area="street">Main Street</button>
  <button data-area="team">Dev team</button>
</div>
<script type="module" src="8bit.js"></script>
</body>
</html>
